name: Publish jiskey Docker image

on:
  push:
    branches:
      - "jiskey_develop"
    tags:
      - "jiskey_*"
  workflow_dispatch:

env:
  REGISTRY_IMAGE: jj1guj/jiskey

jobs:
  decide_latest:
    runs-on: ubuntu-latest
    outputs:
      is_latest: ${{ steps.check.outputs.is_latest }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Decide whether this tag should update latest
        id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "${GITHUB_REF#refs/tags/jiskey_}" = "$GITHUB_REF" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch origin master --no-tags
          tag_commit="$(git rev-list -n 1 "$GITHUB_REF")"
          master_head="$(git rev-parse origin/master)"
          if [ "$tag_commit" != "$master_head" ]; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git fetch --tags --force

          current="${GITHUB_REF_NAME#jiskey_}"

          # 数値バージョンのみ latest 判定対象
          if ! echo "$current" | grep -Eq '^[0-9]+(\.[0-9]+)*$'; then
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          max_version="$(
            git tag -l 'jiskey_*' \
              | sed 's/^jiskey_//' \
              | grep -E '^[0-9]+(\.[0-9]+)*$' \
              | sort -V \
              | tail -n1
          )"

          if [ "$current" = "$max_version" ]; then
            echo "is_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_latest=false" >> "$GITHUB_OUTPUT"
          fi

  # see https://docs.docker.com/build/ci/github-actions/multi-platform/#distribute-build-across-multiple-runners
  build:
    name: Build
    runs-on: ${{ matrix.runs-on }}
    needs:
      - decide_latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runs-on: ubuntu-latest
          - platform: linux/arm64
            runs-on: ubuntu-24.04-arm
    steps:
      - name: Prepare
        run: |
          platform=${{ matrix.platform }}
          echo "PLATFORM_PAIR=${platform//\//-}" >> $GITHUB_ENV
      - name: Check out the repo
        uses: actions/checkout@v6.0.2
        with:
          submodules: true
      - name: Cleanup old buildx caches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Deleting old buildx caches..."
          gh cache list --repo ${{ github.repository }} \
            --key "buildkit-" --order asc --sort last-used \
            --json key -q '.[].key' \
            | while read -r key; do
                echo "Deleting: $key"
                gh cache delete "$key" --repo ${{ github.repository }} --confirm || true
              done
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=^jiskey_(.+)$,group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jiskey_') }}
            type=raw,value=jiskey_develop,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/jiskey_develop' }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jiskey_') && needs.decide_latest.outputs.is_latest == 'true' }}
      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and Push to Docker Hub
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ matrix.platform }}
          provenance: false
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=buildkit-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,scope=buildkit-${{ env.PLATFORM_PAIR }},mode=min
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - name: Upload digest
        uses: actions/upload-artifact@v6
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: ubuntu-latest
    needs:
      - build
      - decide_latest
    steps:
      - name: Download digests
        uses: actions/download-artifact@v7
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY_IMAGE }}
          flavor: |
            latest=false
          tags: |
            type=match,pattern=^jiskey_(.+)$,group=1,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jiskey_') }}
            type=raw,value=jiskey_develop,enable=${{ github.event_name == 'push' && github.ref == 'refs/heads/jiskey_develop' }}
            type=raw,value=test,enable=${{ github.event_name == 'workflow_dispatch' }}
            type=raw,value=latest,enable=${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/jiskey_') && needs.decide_latest.outputs.is_latest == 'true' }}
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.REGISTRY_IMAGE }}@sha256:%s ' *)
      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY_IMAGE }}:${{ steps.meta.outputs.version }}
